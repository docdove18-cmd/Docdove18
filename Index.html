<!DOCTYPE html>  <html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">  
<meta name="theme-color" content="#07131f">  
<title>RASHKAJUE Free Lip Sync AI</title>  
<style>  
*{box-sizing:border-box}body{margin:0;background:#07131f;color:#fff;font-family:Arial,sans-serif}  
.app{max-width:520px;margin:auto;min-height:100vh;padding:28px 18px 35px}  
.logo{font-size:30px;font-weight:800;letter-spacing:1px}.sub{color:#8fa6b8;margin:5px 0 28px}  
.card{background:#0d2030;border:1px solid #18364b;border-radius:20px;padding:18px;margin:14px 0}  
h2{margin:0 0 8px;font-size:21px}.muted{color:#91a9ba;font-size:14px;line-height:1.5}  
.btn{width:100%;border:0;border-radius:14px;padding:15px;margin-top:12px;font-size:16px;font-weight:700;cursor:pointer}  
.primary{background:#19c37d;color:#04140d}.secondary{background:#15334a;color:#fff}  
input[type=file]{display:none}.filebox{display:block;border:1px dashed #2d5872;border-radius:14px;padding:18px;text-align:center;margin-top:12px;color:#c8d8e3;cursor:pointer}  
.preview{width:100%;max-height:290px;object-fit:contain;border-radius:14px;margin-top:14px;background:#061018;display:none}  
.status{margin-top:14px;color:#9fd9c0;font-size:14px;min-height:20px}  
.small{font-size:12px;color:#718b9d;margin-top:20px;text-align:center}  
</style>  
</head>  
<body>  
<div class="app">  
  <div class="logo">RASHKAJUE</div>  
  <div class="sub">FREE LIP SYNC AI</div>    <div class="card">  
    <h2>🎬 Create Lip Sync</h2>  
    <div class="muted">Choose a photo or video, then add the voice/audio you want to synchronize.</div>  <label class="filebox" for="media">📸 Select Photo / Video</label>  
<input id="media" type="file" accept="image/*,video/*">  

<label class="filebox" for="audio">🎵 Select Audio</label>  
<input id="audio" type="file" accept="audio/*">  

<img id="imgPreview" class="preview">  
<video id="videoPreview" class="preview" controls></video>  

<button class="btn primary" id="generate">Generate Lip Sync</button>  
<div class="status" id="status"></div>

  </div>    <div class="card">  
    <h2>📁 My Projects</h2>  
    <div class="muted">Your future generated videos will appear here.</div>  
    <button class="btn secondary" onclick="alert('Projects will be enabled in the next version.')">Open Projects</button>  
  </div>    <div class="card">  
    <h2>⚙️ Settings</h2>  
    <div class="muted">Version 1.0 prototype • Mobile-first</div>  
  </div>    <div class="small">RASHKAJUE AI • Built for Android</div>  
</div>  <script>  
const media=document.getElementById('media');  
const audio=document.getElementById('audio');  
const img=document.getElementById('imgPreview');  
const video=document.getElementById('videoPreview');  
const status=document.getElementById('status');  
  
media.addEventListener('change',()=>{  
  const f=media.files[0]; if(!f)return;  
  const url=URL.createObjectURL(f);  
  img.style.display='none'; video.style.display='none';  
  if(f.type.startsWith('image/')){img.src=url;img.style.display='block'}  
  else if(f.type.startsWith('video/')){video.src=url;video.style.display='block'}  
  status.textContent='Media selected: '+f.name;  
});  
audio.addEventListener('change',()=>{  
  const f=audio.files[0]; if(f) status.textContent='Audio selected: '+f.name;  
});  
document.getElementById('generate').addEventListener('click',()=>{  
  if(!media.files[0]){status.textContent='Please select a photo or video first.';return}  
  if(!audio.files[0]){status.textContent='Please select an audio file first.';return}  
  status.textContent='Prototype ready. The AI lip-sync engine will be connected in the next version.';  
});  
</script>  </body>  
</html>
