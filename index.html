<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App - Login</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 300px; text-align: center; }
        input { width: 90%; padding: 12px; margin: 15px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #008069; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background: #006654; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Chat App</h2>
        <input type="text" id="usernameInput" placeholder="Enter your username...">
        <button onclick="startChat()">Start Chat</button>
    </div>

    <script>
        function startChat() {
            const username = document.getElementById('usernameInput').value.trim();
            if (username === "") {
                alert("Please enter your name first!");
                return;
            }
            // Save username to browser storage and move to chat page
            localStorage.setItem('chat_username', username);
            window.location.href = 'chat.html';
        }
    </script>

</body>
</html>
