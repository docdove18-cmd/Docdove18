<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rash Chat</title>
    <style>
        body {
            margin: 0;
            background: #121b22;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e9edef;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .chat-header {
            background: #202c33;
            padding: 12px 16px;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #2a3942;
        }
        .chat-container {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-color: #0b141a;
        }
        .message-row {
            display: flex;
            width: 100%;
        }
        .user-row {
            justify-content: flex-end;
        }
        .message-bubble {
            max-width: 75%;
            background: #005c4b;
            padding: 8px 12px;
            border-radius: 8px 0 8px 8px;
            position: relative;
            box-shadow: 0 1px 0.5px rgba(0,0,0,0.3);
            word-break: break-word;
        }
        .message-bubble img {
            width: 100%;
            border-radius: 6px;
            margin-bottom: 4px;
        }
        .delete-btn {
            position: absolute;
            top: 4px;
            right: 6px;
            background: rgba(0,0,0,0.4);
            border: none;
            color: #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 10px;
            cursor: pointer;
            display: none;
        }
        .message-bubble:hover .delete-btn {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-input-area {
            background: #202c33;
            padding: 10px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .chat-input-area input {
            flex: 1;
            background: #2a3942;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }
        .chat-input-area button {
            background: #00a884;
            border: none;
            color: #fff;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="chat-header">Rash Live Chat</div>

    <div class="chat-container" id="chatBox">
        <!-- Messages will appear here -->
    </div>

    <div class="chat-input-area">
        <input type="text" id="messageInput" placeholder="Type a message or image link...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const chatBox = document.getElementById("chatBox");
        let messages = [];

        function renderChat() {
            chatBox.innerHTML = "";
            messages.forEach((msg, index) => {
                let row = document.createElement("div");
                row.className = "message-row user-row";
                
                let bubble = document.createElement("div");
                bubble.className = "message-bubble";

                if (msg.type === 'image') {
                    let img = document.createElement("img");
                    img.src = msg.content;
                    bubble.appendChild(img);
                } else {
                    let text = document.createElement("div");
                    text.innerText = msg.content;
                    bubble.appendChild(text);
                }

                // WhatsApp style delete button on hover/tap
                let delBtn = document.createElement("button");
                delBtn.className = "delete-btn";
                delBtn.innerHTML = "✕";
                delBtn.onclick = () => deleteMessage(index);
                bubble.appendChild(delBtn);

                row.appendChild(bubble);
                chatBox.appendChild(row);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendMessage() {
            let input = document.getElementById("messageInput");
            let text = input.value.trim();
            if (!text) return;

            // Check if text is an image link, else regular text
            if (text.startsWith("http") && (text.includes(".jpg") || text.includes(".png") || text.includes(".webp"))) {
                messages.push({ type: 'image', content: text });
            } else {
                messages.push({ type: 'text', content: text });
            }

            input.value = "";
            renderChat();
        }

        function deleteMessage(index) {
            messages.splice(index, 1);
            renderChat();
        }
    </script>
</body>
</html>
