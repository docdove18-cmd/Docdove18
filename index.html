<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Football Match</title>
    <style>
        body {
            margin: 0;
            background: #0b0f19;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            width: 360px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .timer {
            color: #b9ec0c;
        }
        canvas {
            background: linear-gradient(to bottom, #1e5631, #2e8b57);
            border: 4px solid #fff;
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            touch-action: none;
        }
    </style>
</head>
<body>

    <div class="hud">
        <div><span id="team1Name">Haaland/Yamal</span>: <span id="playerScore">0</span></div>
        <div class="timer">⏱ <span id="matchTimer">90</span>s</div>
        <div><span id="team2Name">Mbappé/Raya</span>: <span id="aiScore">0</span></div>
    </div>
    
    <canvas id="gameCanvas" width="360" height="520"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let playerScore = 0;
        let aiScore = 0;
        let timeLeft = 90;
        let gameActive = true;
        let celebrationText = "";
        let celebrationTimer = 0;

        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 8,
            speed: 4.5,
            velocityX: 2.5,
            velocityY: 4
        };

        // User Team Players (Controlled by Touch/Mouse)
        const playerStriker = {
            name: "Haaland",
            x: canvas.width / 2 - 25,
            y: canvas.height - 70,
            width: 50,
            height: 14,
            color: "#b9ec0c"
        };

        const playerWinger = {
            name: "Yamal",
            x: 60,
            y: canvas.height - 140,
            width: 40,
            height: 12,
            color: "#ffffff"
        };

        // Opponent Team Players (AI Controlled)
        const aiDefender = {
            name: "Mbappé",
            x: canvas.width / 2 - 25,
            y: 70,
            width: 50,
            height: 14,
            color: "#14e453"
        };

        const aiGoalie = {
            name: "Raya",
            x: canvas.width / 2 - 30,
            y: 25,
            width: 60,
            height: 10,
            color: "#ffcc00"
        };

        // Match Timer
        const timerInterval = setInterval(() => {
            if (gameActive && timeLeft > 0) {
                timeLeft--;
                document.getElementById("matchTimer").innerText = timeLeft;
                if (timeLeft <= 0) {
                    gameActive = false;
                    celebrationText = playerScore > aiScore ? "FULL TIME: YOU WIN!" : (playerScore < aiScore ? "FULL TIME: AI WINS!" : "FULL TIME: DRAW!");
                }
            }
        }, 1000);

        // Touch & Mouse Movement Controls
        function handleMove(clientX) {
            let rect = canvas.getBoundingClientRect();
            let mouseX = clientX - rect.left;
            playerStriker.x = mouseX - playerStriker.width / 2;
            if (playerStriker.x < 0) playerStriker.x = 0;
            if (playerStriker.x + playerStriker.width > canvas.width) playerStriker.x = canvas.width - playerStriker.width;
        }

        canvas.addEventListener("touchmove", (e) => handleMove(e.touches[0].clientX));
        canvas.addEventListener("mousemove", (e) => handleMove(e.clientX));

        function resetBall(scorer) {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.velocityX = (Math.random() > 0.5 ? 1 : -1) * 3;
            ball.velocityY = (scorer === 'player' ? -1 : 1) * 4;
            celebrationTimer = 45;
        }

        function update() {
            if (!gameActive) return;

            if (celebrationTimer > 0) {
                celebrationTimer--;
                return;
            }

            ball.x += ball.velocityX;
            ball.y += ball.velocityY;

            // AI tracking logic for Mbappé & Raya
            let aiCenter = aiDefender.x + aiDefender.width / 2;
            if (aiCenter < ball.x - 5) aiDefender.x += 3;
            else if (aiCenter > ball.x + 5) aiDefender.x -= 3;
            if (aiDefender.x < 0) aiDefender.x = 0;
            if (aiDefender.x + aiDefender.width > canvas.width) aiDefender.x = canvas.width - aiDefender.width;

            // Goalie simple tracking
            let goalieCenter = aiGoalie.x + aiGoalie.width / 2;
            if (goalieCenter < ball.x) aiGoalie.x += 2;
            else if (goalieCenter > ball.x) aiGoalie.x -= 2;

            // Winger autonomous movement
            playerWinger.x += Math.sin(Date.now() / 300) * 2;

            // Wall bounces
            if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
                ball.velocityX = -ball.velocityX;
            }

            // Goal detection
            if (ball.y < 20) {
                playerScore++;
                document.getElementById("playerScore").innerText = playerScore;
                celebrations("GOAL! HAALAND SCORES!");
                resetBall('player');
            } else if (ball.y > canvas.height - 20) {
                aiScore++;
                document.getElementById("aiScore").innerText = aiScore;
                celebrations("MBAPPÉ SCORES!");
                resetBall('ai');
            }

            // Paddle / Player Collisions
            checkCollision(playerStriker);
            checkCollision(playerWinger);
            checkCollision(aiDefender);
            checkCollision(aiGoalie);
        }

        function celebrations(text) {
            celebrationText = text;
        }

        function checkCollision(p) {
            if (
                ball.x > p.x &&
                ball.x < p.x + p.width &&
                ball.y + ball.radius > p.y &&
                ball.y - ball.radius < p.y + p.height
            ) {
                let collidePoint = ball.x - (p.x + p.width / 2);
                let angleRad = (Math.PI / 3) * (collidePoint / (p.width / 2));
                let direction = (ball.y > canvas.height / 2) ? -1 : 1;
                ball.velocityX = ball.speed * Math.sin(angleRad);
                ball.velocityY = direction * ball.speed * Math.cos(angleRad);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Pitch Markings
            ctx.strokeStyle = "rgba(255,255,255,0.25)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 55, 0, Math.PI * 2);
            ctx.stroke();

            // Goal Boxes
            ctx.strokeRect(canvas.width / 2 - 80, 0, 160, 35);
            ctx.strokeRect(canvas.width / 2 - 80, canvas.height - 35, 160, 35);

            // Draw Players with Names
            drawPlayer(playerStriker);
            drawPlayer(playerWinger);
            drawPlayer(aiDefender);
            drawPlayer(aiGoalie);

            // Draw Ball
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            // Overlay Text
            if (celebrationTimer > 0 && gameActive) {
                ctx.fillStyle = "#ffcc00";
                ctx.font = "bold 22px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(celebrationText, canvas.width / 2, canvas.height / 2 + 8);
            } else if (!gameActive) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 26px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(celebrationText, canvas.width / 2, canvas.height / 2);
            }
        }

        function drawPlayer(p) {
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.width, p.height);
            ctx.fillStyle = "#ffffff";
            ctx.font = "10px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(p.name, p.x + p.width / 2, p.y - 4);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
