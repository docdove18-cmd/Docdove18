<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docdove18 | Live Chat & Calls</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f9; text-align: center; }
    #chat-box { width: 100%; max-width: 500px; height: 300px; border: 1px solid #ccc; background: #fff; margin: 15px auto; overflow-y: scroll; padding: 10px; text-align: left; }
    .input-area { display: flex; flex-direction: column; gap: 8px; max-width: 500px; margin: 0 auto; }
    .btn-group { display: flex; gap: 5px; flex-wrap: wrap; }
    input[type="text"] { padding: 10px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
    button { padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; flex: 1; }
    button.call-btn { background: #28a745; }
    button.recording { background: #dc3545; }
    .file-input { display: none; }
    label.btn-label { padding: 10px; background: #17a2b8; color: white; border-radius: 4px; cursor: pointer; flex: 1; text-align: center; font-size: 14px; }
    #video-container { display: flex; justify-content: center; gap: 10px; margin: 10px auto; max-width: 500px; }
    video { width: 48%; background: #000; border-radius: 6px; display: none; }
  </style>
</head>
<body>

  <h2>Docdove18 Live Community Chat</h2>
  
  <div id="video-container">
    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>

  <div id="chat-box">
    <p><i>Messages will appear here...</i></p>
  </div>

  <div class="input-area">
    <div class="btn-group">
      <button class="call-btn" onclick="startCall()">📞 Call User</button>
      <button id="recordBtn" type="button" onclick="toggleRecording()">🎙️ Voice</button>
    </div>

    <div class="btn-group">
      <label for="cameraInput" class="btn-label">📷 Camera Photo</label>
      <input type="file" id="cameraInput" class="file-input" accept="image/*" capture="environment">

      <label for="imageInput" class="btn-label">📁 Gallery</label>
      <input type="file" id="imageInput" class="file-input" accept="image/*">
    </div>

    <input type="text" id="messageInput" placeholder="Type a message...">
    <button onclick="sendMessage()">Send Message</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD_M7Xg6TAIxHB3Vvp1",
      authDomain: "rash-kajue-chat.firebaseapp.com",
      projectId: "rash-kajue-chat",
      storageBucket: "rash-kajue-chat.firebasestorage.app",
      messagingSenderId: "859601059111",
      appId: "1:859601059111:web:c4ea50"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Setup Peer Connection for Calls
    const peer = new Peer();
    let myPeerId = "";
    let activeCallPeerId = "";

    peer.on('open', (id) => {
      myPeerId = id;
    });

    // Answer incoming call
    peer.on('call', async (call) => {
      if (confirm("Incoming call! Accept?")) {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById("localVideo").style.display = "block";
        document.getElementById("remoteVideo").style.display = "block";
        document.getElementById("localVideo").srcObject = stream;
        
        call.answer(stream);
        call.on('stream', (remoteStream) => {
          document.getElementById("remoteVideo").srcObject = remoteStream;
        });
      }
    });

    window.startCall = async function() {
      if (!activeCallPeerId) {
        alert("No active user available to call yet. Waiting for another device to open the site.");
        return;
      }
      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      document.getElementById("localVideo").style.display = "block";
      document.getElementById("remoteVideo").style.display = "block";
      document.getElementById("localVideo").srcObject = stream;

      const call = peer.call(activeCallPeerId, stream);
      call.on('stream', (remoteStream) => {
        document.getElementById("remoteVideo").srcObject = remoteStream;
      });
    };

    // Base64 helper
    const fileToBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });

    let mediaRecorder;
    let audioChunks = [];
    let base64Audio = "";

    window.toggleRecording = async function() {
      const btn = document.getElementById("recordBtn");
      if (!mediaRecorder || mediaRecorder.state === "inactive") {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            base64Audio = await fileToBase64(audioBlob);
          };
          mediaRecorder.start();
          btn.innerText = "🛑 Stop";
          btn.classList.add("recording");
        } catch (err) {
          alert("Microphone required.");
        }
      } else {
        mediaRecorder.stop();
        btn.innerText = "🎙️ Ready";
        btn.classList.remove("recording");
      }
    };

    // Realtime chat listener
    const q = query(collection(db, "messages"), orderBy("timestamp", "asc"));
    onSnapshot(q, (snapshot) => {
      const chatBox = document.getElementById("chat-box");
      chatBox.innerHTML = "";
      snapshot.forEach((doc) => {
        const data = doc.data();
        if (data.peerId && data.peerId !== myPeerId) {
          activeCallPeerId = data.peerId;
        }

        const msgDiv = document.createElement("div");
        msgDiv.style.marginBottom = "10px";
        let content = `<p style="margin:2px 0;"><b>User:</b> ${data.text || ''}</p>`;
        if (data.imageBase64) content += `<img src="${data.imageBase64}" style="max-width:200px;"><br>`;
        if (data.audioBase64) content += `<audio controls src="${data.audioBase64}"></audio><br>`;
        msgDiv.innerHTML = content;
        chatBox.appendChild(msgDiv);
      });
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    window.sendMessage = async function() {
      const text = document.getElementById("messageInput").value;
      const cameraFile = document.getElementById("cameraInput").files[0];
      const galleryFile = document.getElementById("imageInput").files[0];
      const selectedFile = cameraFile || galleryFile;

      let imageBase64 = "";
      if (selectedFile) imageBase64 = await fileToBase64(selectedFile);

      if (text || imageBase64 || base64Audio) {
        await addDoc(collection(db, "messages"), {
          text: text,
          imageBase64: imageBase64,
          audioBase64: base64Audio,
          peerId: myPeerId,
          timestamp: new Date()
        });

        document.getElementById("messageInput").value = "";
        document.getElementById("cameraInput").value = "";
        document.getElementById("imageInput").value = "";
        base64Audio = "";
        document.getElementById("recordBtn").innerText = "🎙️ Voice";
      }
    }
  </script>
</body>
</html>
