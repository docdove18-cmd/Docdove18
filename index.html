<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Football Match</title>
    <style>
        body {
            margin: 0;
            background: #0b0f19;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            width: 360px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .timer {
            color: #b9ec0c;
        }
        canvas {
            background: linear-gradient(to bottom, #1e5631, #2e8b57);
            border: 4px solid #fff;
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            touch-action: none;
        }
    </style>
</head>
<body>

    <div class="hud">
        <div>Score: <span id="playerScore">0</span> - <span id="aiScore">0</span></div>
        <div class="timer">Time: <span id="matchTimer">90</span>s</div>
    </div>
    
    <canvas id="gameCanvas" width="360" height="500"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let playerScore = 0;
        let aiScore = 0;
        let timeLeft = 90;
        let gameActive = true;
        let celebrationText = "";
        let celebrationTimer = 0;

        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 9,
            speed: 4.5,
            velocityX: 3,
            velocityY: 4.5
        };

        const player = {
            x: canvas.width / 2 - 35,
            y: canvas.height - 45,
            width: 70,
            height: 14,
            color: "#b9ec0c"
        };

        const ai = {
            x: canvas.width / 2 - 35,
            y: 35,
            width: 70,
            height: 14,
            color: "#14e453"
        };

        // Timer countdown loop
        const timerInterval = setInterval(() => {
            if (gameActive && timeLeft > 0) {
                timeLeft--;
                document.getElementById("matchTimer").innerText = timeLeft;
                if (timeLeft <= 0) {
                    gameActive = false;
                    celebrationText = playerScore > aiScore ? "YOU WIN!" : (playerScore < aiScore ? "AI WINS!" : "DRAW!");
                }
            }
        }, 1000);

        // Touch and mouse movement tracking
        function handleMove(clientX) {
            let rect = canvas.getBoundingClientRect();
            let mouseX = clientX - rect.left;
            player.x = mouseX - player.width / 2;
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
        }

        canvas.addEventListener("touchmove", (e) => {
            handleMove(e.touches[0].clientX);
        });

        canvas.addEventListener("mousemove", (e) => {
            handleMove(e.clientX);
        });

        function resetBall(scorer) {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.velocityX = (Math.random() > 0.5 ? 1 : -1) * 3;
            ball.velocityY = (scorer === 'player' ? -1 : 1) * 4;
            celebrationTimer = 40; // frames to show celebration
        }

        function update() {
            if (!gameActive) return;

            if (celebrationTimer > 0) {
                celebrationTimer--;
                return;
            }

            // Move ball
            ball.x += ball.velocityX;
            ball.y += ball.velocityY;

            // Advanced AI tracking with speed limitation
            let aiCenter = ai.x + ai.width / 2;
            let aiSpeed = 3.2;
            if (aiCenter < ball.x - 6) ai.x += aiSpeed;
            else if (aiCenter > ball.x + 6) ai.x -= aiSpeed;
            if (ai.x < 0) ai.x = 0;
            if (ai.x + ai.width > canvas.width) ai.x = canvas.width - ai.width;

            // Wall bounces (Left & Right boundaries)
            if (ball.x - ball.radius < 0) {
                ball.x = ball.radius;
                ball.velocityX = -ball.velocityX;
            } else if (ball.x + ball.radius > canvas.width) {
                ball.x = canvas.width - ball.radius;
                ball.velocityX = -ball.velocityX;
            }

            // Goal detection (Top & Bottom)
            if (ball.y - ball.radius < 0) {
                playerScore++;
                document.getElementById("playerScore").innerText = playerScore;
                celebrationText = "GOAL!";
                resetBall('player');
            } else if (ball.y + ball.radius > canvas.height) {
                aiScore++;
                document.getElementById("aiScore").innerText = aiScore;
                celebrationText = "AI SCORES!";
                resetBall('ai');
            }

            // Paddle collisions
            let activePaddle = (ball.y > canvas.height / 2) ? player : ai;
            if (
                ball.x > activePaddle.x &&
                ball.x < activePaddle.x + activePaddle.width &&
                ball.y + ball.radius > activePaddle.y &&
                ball.y - ball.radius < activePaddle.y + activePaddle.height
            ) {
                let collidePoint = ball.x - (activePaddle.x + activePaddle.width / 2);
                let angleRad = (Math.PI / 3) * (collidePoint / (activePaddle.width / 2));
                let direction = (ball.y > canvas.height / 2) ? -1 : 1;

                ball.velocityX = ball.speed * Math.sin(angleRad);
                ball.velocityY = direction * ball.speed * Math.cos(angleRad);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Pitch markings (Center circle & line)
            ctx.strokeStyle = "rgba(255,255,255,0.2)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 50, 0, Math.PI * 2);
            ctx.stroke();

            // Goal boxes
            ctx.strokeRect(canvas.width / 2 - 70, 0, 140, 30);
            ctx.strokeRect(canvas.width / 2 - 70, canvas.height - 30, 140, 30);

            // Paddles
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            ctx.fillStyle = ai.color;
            ctx.fillRect(ai.x, ai.y, ai.width, ai.height);

            // Ball
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            // Goal/Match Over Overlay text
            if (celebrationTimer > 0 && gameActive) {
                ctx.fillStyle = "#ffcc00";
                ctx.font = "bold 32px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(celebrationText, canvas.width / 2, canvas.height / 2 + 10);
            } else if (!gameActive) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 30px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("MATCH OVER", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "#b9ec0c";
                ctx.font = "bold 22px sans-serif";
                ctx.fillText(celebrationText, canvas.width / 2, canvas.height / 2 + 25);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
