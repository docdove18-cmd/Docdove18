<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rash - Kajue PWA</title>
    <!-- Firebase App (Core) SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <!-- Firebase Realtime Database SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #121b22;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e9edef;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }
        .app-header {
            background: #202c33;
            padding: 10px 16px;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #2a3942;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .header-actions {
            display: flex;
            gap: 8px;
        }
        .header-actions button {
            background: #00a884;
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #0b141a;
            position: relative;
        }
        .chat-container {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message-row {
            display: flex;
            width: 100%;
        }
        .user-row {
            justify-content: flex-end;
        }
        .message-bubble {
            max-width: 75%;
            background: #005c4b;
            padding: 8px 12px;
            border-radius: 8px 0 8px 8px;
            position: relative;
            box-shadow: 0 1px 0.5px rgba(0,0,0,0.3);
            word-break: break-word;
        }
        .message-bubble img {
            width: 100%;
            border-radius: 6px;
            margin-bottom: 4px;
        }
        .delete-btn {
            position: absolute;
            top: 4px;
            right: 6px;
            background: rgba(0,0,0,0.5);
            border: none;
            color: #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .media-bar {
            background: #202c33;
            padding: 8px 12px;
            display: flex;
            gap: 8px;
            border-top: 1px solid #2a3942;
            overflow-x: auto;
            flex-shrink: 0;
        }
        .media-btn {
            background: #2a3942;
            border: none;
            color: #e9edef;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }
        .chat-input-area {
            background: #202c33;
            padding: 8px 10px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }
        .chat-input-area input {
            flex: 1;
            background: #2a3942;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }
        .chat-input-area button {
            background: #00a884;
            border: none;
            color: #fff;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        /* Settings Modal Panel */
        #settingsModal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #121b22;
            z-index: 50;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .settings-header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a3942;
            padding-bottom: 10px;
        }
        .settings-group {
            margin-bottom: 16px;
        }
        .settings-group label {
            display: block;
            font-size: 13px;
            color: #00a884;
            margin-bottom: 6px;
        }
        .settings-group input, .settings-group select {
            width: 100%;
            background: #2a3942;
            border: none;
            padding: 10px;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <span id="appTitle">Rash Chat</span>
        <div class="header-actions">
            <button onclick="startCall()">📞 Call</button>
            <button onclick="toggleSettings()">⚙️ Settings</button>
        </div>
    </div>

    <div class="main-container">
        <div class="chat-container" id="chatBox"></div>

        <div class="media-bar">
            <button class="media-btn" onclick="triggerUpload()">📷 Camera / Gallery</button>
            <button class="media-btn" onclick="sendVoiceNote()">🎤 Voice Note</button>
            <input type="file" id="fileInput" style="display:none" accept="image/*" onchange="handleFile(event)">
        </div>

        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>

        <!-- Settings Modal View -->
        <div id="settingsModal">
            <div class="settings-header">
                <span>App Settings</span>
                <button onclick="toggleSettings()" style="background:#2a3942; border:none; color:#fff; padding:6px 12px; border-radius:6px; cursor:pointer;">Close</button>
            </div>
            <div class="settings-group">
                <label>Profile Name</label>
                <input type="text" id="setNameInput" value="Rash">
            </div>
            <div class="settings-group">
                <label>Theme Accent Color</label>
                <select id="setThemeColor">
                    <option value="#00a884">WhatsApp Green</option>
                    <option value="#b9ec0c">Lime Accent</option>
                    <option value="#14e453">Neon Green</option>
                </select>
            </div>
            <button onclick="saveSettings()" style="width:100%; background:#00a884; border:none; color:#fff; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer; margin-top:10px;">Save Changes</button>
        </div>
    </div>

    <script>
        // TODO: Replace with your own Firebase project configuration keys
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('messages');

        const chatBox = document.getElementById("chatBox");

        // Listen for live messages incoming from any device
        dbRef.on('child_added', (snapshot) => {
            let msg = snapshot.val();
            let msgKey = snapshot.key;
            appendMessageToUI(msg, msgKey);
        });

        // Listen for deleted messages across devices
        dbRef.on('child_removed', (snapshot) => {
            let msgKey = snapshot.key;
            let element = document.getElementById("msg-" + msgKey);
            if (element) element.remove();
        });

        function sendMessage() {
            let input = document.getElementById("messageInput");
            let text = input.value.trim();
            if (!text) return;

            // Push to Firebase database instead of local array
            dbRef.push({
                type: 'text',
                content: text,
                timestamp: Date.now()
            });

            input.value = "";
        }

        function handleFile(event) {
            let file = event.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    dbRef.push({
                        type: 'image',
                        content: e.target.result,
                        timestamp: Date.now()
                    });
                };
                reader.readAsDataURL(file);
            }
        }

        function sendVoiceNote() {
            dbRef.push({
                type: 'audio',
                content: 'https://www.w3schools.com/html/horse.mp3',
                timestamp: Date.now()
            });
        }

        function appendMessageToUI(msg, key) {
            let row = document.createElement("div");
            row.className = "message-row user-row";
            row.id = "msg-" + key;
            
            let bubble = document.createElement("div");
            bubble.className = "message-bubble";

            if (msg.type === 'image') {
                let img = document.createElement("img");
                img.src = msg.content;
                bubble.appendChild(img);
            } else if (msg.type === 'audio') {
                let audio = document.createElement("audio");
                audio.controls = true;
                audio.src = msg.content;
                bubble.appendChild(audio);
            } else {
                let text = document.createElement("div");
                text.innerText = msg.content;
                bubble.appendChild(text);
            }

            let delBtn = document.createElement("button");
            delBtn.className = "delete-btn";
            delBtn.innerHTML = "✕";
            delBtn.onclick = () => deleteMessage(key);
            bubble.appendChild(delBtn);

            row.appendChild(bubble);
            chatBox.appendChild(row);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function deleteMessage(key) {
            // Removes message globally from Firebase database
            firebase.database().ref('messages/' + key).remove();
        }

        function triggerUpload() {
            document.getElementById("fileInput").click();
        }

        function startCall() {
            alert("Connecting audio call...");
        }

        function toggleSettings() {
            let modal = document.getElementById("settingsModal");
            modal.style.display = modal.style.display === "block" ? "none" : "block";
        }

        function saveSettings() {
            let newName = document.getElementById("setNameInput").value;
            let newColor = document.getElementById("setThemeColor").value;
            
            document.getElementById("appTitle").innerText = newName + " Chat";
            document.querySelectorAll(".chat-input-area button, .header-actions button").forEach(btn => {
                btn.style.background = newColor;
            });
            
            toggleSettings();
        }
    </script>
</body>
</html>
