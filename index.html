<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docdove18 | Live Chat, Voice & Camera</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f9; text-align: center; }
    #chat-box { width: 100%; max-width: 500px; height: 350px; border: 1px solid #ccc; background: #fff; margin: 20px auto; overflow-y: scroll; padding: 10px; text-align: left; }
    .input-area { display: flex; flex-direction: column; gap: 10px; max-width: 500px; margin: 0 auto; }
    .btn-group { display: flex; gap: 5px; }
    input[type="text"] { padding: 10px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
    button { padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; flex: 1; }
    button.recording { background: #dc3545; }
    .file-input { display: none; }
    label.btn-label { padding: 10px; background: #28a745; color: white; border-radius: 4px; cursor: pointer; flex: 1; text-align: center; font-size: 14px; }
  </style>
</head>
<body>

  <h2>Docdove18 Live Community Chat</h2>
  
  <div id="chat-box">
    <p><i>Messages will appear here...</i></p>
  </div>

  <div class="input-area">
    <input type="text" id="messageInput" placeholder="Type a message...">
    
    <div class="btn-group">
      <!-- Camera capture button -->
      <label for="cameraInput" class="btn-label">📷 Camera</label>
      <input type="file" id="cameraInput" class="file-input" accept="image/*" capture="environment">

      <!-- File upload button -->
      <label for="imageInput" class="btn-label">📁 Gallery</label>
      <input type="file" id="imageInput" class="file-input" accept="image/*">

      <!-- Voice note record button -->
      <button id="recordBtn" type="button" onclick="toggleRecording()">🎙️ Record Voice</button>
    </div>

    <button onclick="sendMessage()" style="margin-top: 5px;">Send Message</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD_M7Xg6TAIxHB3Vvp1",
      authDomain: "rash-kajue-chat.firebaseapp.com",
      projectId: "rash-kajue-chat",
      storageBucket: "rash-kajue-chat.firebasestorage.app",
      messagingSenderId: "859601059111",
      appId: "1:859601059111:web:c4ea50"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let mediaRecorder;
    let audioChunks = [];
    let audioBlob = null;

    // Toggle Voice Recording
    window.toggleRecording = async function() {
      const btn = document.getElementById("recordBtn");
      if (!mediaRecorder || mediaRecorder.state === "inactive") {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          };
          mediaRecorder.start();
          btn.innerText = "🛑 Stop Recording";
          btn.classList.add("recording");
        } catch (err) {
          alert("Microphone access denied or not supported.");
        }
      } else {
        mediaRecorder.stop();
        btn.innerText = "🎙️ Voice Ready (Click Send)";
        btn.classList.remove("recording");
      }
    };

    // Listen for live messages
    const q = query(collection(db, "messages"), orderBy("timestamp", "asc"));
    onSnapshot(q, (snapshot) => {
      const chatBox = document.getElementById("chat-box");
      chatBox.innerHTML = "";
      snapshot.forEach((doc) => {
        const data = doc.data();
        const msgDiv = document.createElement("div");
        msgDiv.style.marginBottom = "12px";
        
        let content = `<p style="margin: 2px 0;"><b>User:</b> ${data.text || ''}</p>`;
        if (data.imageUrl) {
          content += `<img src="${data.imageUrl}" style="max-width:200px; border-radius:5px;"><br>`;
        }
        if (data.audioUrl) {
          content += `<audio controls src="${data.audioUrl}"></audio><br>`;
        }
        msgDiv.innerHTML = content;
        chatBox.appendChild(msgDiv);
      });
      chatBox.scrollTop = chatBox.scrollHeight;
    });

    // Send Message function
    window.sendMessage = async function() {
      const text = document.getElementById("messageInput").value;
      const cameraFile = document.getElementById("cameraInput").files[0];
      const galleryFile = document.getElementById("imageInput").files[0];
      const fileInput = cameraFile || galleryFile;

      let imageUrl = "";
      let audioUrl = "";

      // Upload image if selected
      if (fileInput) {
        const storageRef = ref(storage, 'chat_images/' + Date.now() + '_' + fileInput.name);
        await uploadBytes(storageRef, fileInput);
        imageUrl = await getDownloadURL(storageRef);
      }

      // Upload voice note if recorded
      if (audioBlob) {
        const audioRef = ref(storage, 'chat_audio/' + Date.now() + '_voice.webm');
        await uploadBytes(audioRef, audioBlob);
        audioUrl = await getDownloadURL(audioRef);
        audioBlob = null;
        document.getElementById("recordBtn").innerText = "🎙️ Record Voice";
      }

      if (text || imageUrl || audioUrl) {
        await addDoc(collection(db, "messages"), {
          text: text,
          imageUrl: imageUrl,
          audioUrl: audioUrl,
          timestamp: new Date()
        });
        document.getElementById("messageInput").value = "";
        document.getElementById("cameraInput").value = "";
        document.getElementById("imageInput").value = "";
      }
    }
  </script>
</body>
</html>
