<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Football Simulation</title>
    <style>
        body {
            margin: 0;
            background: #0b0f19;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            width: 360px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .timer {
            color: #b9ec0c;
        }
        canvas {
            background: linear-gradient(to bottom, #1e5631, #2e8b57);
            border: 4px solid #fff;
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <div class="hud">
        <div>Score: <span id="teamOneScore">0</span> - <span id="teamTwoScore">0</span></div>
        <div class="timer">Time: <span id="matchTimer">90</span>s</div>
    </div>
    
    <canvas id="gameCanvas" width="360" height="500"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let teamOneScore = 0;
        let teamTwoScore = 0;
        let timeLeft = 90;
        let gameActive = true;
        let celebrationText = "";
        let celebrationTimer = 0;

        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 9,
            speed: 4.5,
            velocityX: 3,
            velocityY: 4.5
        };

        const paddleTop = {
            x: canvas.width / 2 - 35,
            y: 35,
            width: 70,
            height: 14,
            color: "#14e453"
        };

        const paddleBottom = {
            x: canvas.width / 2 - 35,
            y: canvas.height - 45,
            width: 70,
            height: 14,
            color: "#b9ec0c"
        };

        // Timer countdown loop
        const timerInterval = setInterval(() => {
            if (gameActive && timeLeft > 0) {
                timeLeft--;
                document.getElementById("matchTimer").innerText = timeLeft;
                if (timeLeft <= 0) {
                    gameActive = false;
                    celebrationText = teamOneScore > teamTwoScore ? "TEAM GREEN WINS!" : (teamOneScore < teamTwoScore ? "TEAM LIME WINS!" : "DRAW!");
                }
            }
        }, 1000);

        function resetBall(scorer) {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.velocityX = (Math.random() > 0.5 ? 1 : -1) * 3;
            ball.velocityY = (scorer === 'top' ? 1 : -1) * 4;
            celebrationTimer = 40;
        }

        function update() {
            if (!gameActive) return;

            if (celebrationTimer > 0) {
                celebrationTimer--;
                return;
            }

            // Move ball
            ball.x += ball.velocityX;
            ball.y += ball.velocityY;

            // Autonomous Bot Tracking for both paddles
            let topCenter = paddleTop.x + paddleTop.width / 2;
            if (topCenter < ball.x - 5) paddleTop.x += 3.2;
            else if (topCenter > ball.x + 5) paddleTop.x -= 3.2;
            if (paddleTop.x < 0) paddleTop.x = 0;
            if (paddleTop.x + paddleTop.width > canvas.width) paddleTop.x = canvas.width - paddleTop.width;

            let bottomCenter = paddleBottom.x + paddleBottom.width / 2;
            if (bottomCenter < ball.x - 5) paddleBottom.x += 3.2;
            else if (bottomCenter > ball.x + 5) paddleBottom.x -= 3.2;
            if (paddleBottom.x < 0) paddleBottom.x = 0;
            if (paddleBottom.x + paddleBottom.width > canvas.width) paddleBottom.x = canvas.width - paddleBottom.width;

            // Wall bounces
            if (ball.x - ball.radius < 0) {
                ball.x = ball.radius;
                ball.velocityX = -ball.velocityX;
            } else if (ball.x + ball.radius > canvas.width) {
                ball.x = canvas.width - ball.radius;
                ball.velocityX = -ball.velocityX;
            }

            // Goal detection
            if (ball.y - ball.radius < 0) {
                teamTwoScore++;
                document.getElementById("teamTwoScore").innerText = teamTwoScore;
                celebrationText = "TEAM LIME SCORES!";
                resetBall('top');
            } else if (ball.y + ball.radius > canvas.height) {
                teamOneScore++;
                document.getElementById("teamOneScore").innerText = teamOneScore;
                celebrationText = "TEAM GREEN SCORES!";
                resetBall('bottom');
            }

            // Paddle collisions for top bot
            if (
                ball.x > paddleTop.x &&
                ball.x < paddleTop.x + paddleTop.width &&
                ball.y - ball.radius < paddleTop.y + paddleTop.height &&
                ball.y + ball.radius > paddleTop.y
            ) {
                let collidePoint = ball.x - (paddleTop.x + paddleTop.width / 2);
                let angleRad = (Math.PI / 3) * (collidePoint / (paddleTop.width / 2));
                ball.velocityX = ball.speed * Math.sin(angleRad);
                ball.velocityY = ball.speed * Math.cos(angleRad);
            }

            // Paddle collisions for bottom bot
            if (
                ball.x > paddleBottom.x &&
                ball.x < paddleBottom.x + paddleBottom.width &&
                ball.y + ball.radius > paddleBottom.y &&
                ball.y - ball.radius < paddleBottom.y + paddleBottom.height
            ) {
                let collidePoint = ball.x - (paddleBottom.x + paddleBottom.width / 2);
                let angleRad = (Math.PI / 3) * (collidePoint / (paddleBottom.width / 2));
                ball.velocityX = ball.speed * Math.sin(angleRad);
                ball.velocityY = -ball.speed * Math.cos(angleRad);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Pitch layout
            ctx.strokeStyle = "rgba(255,255,255,0.2)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 50, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeRect(canvas.width / 2 - 70, 0, 140, 30);
            ctx.strokeRect(canvas.width / 2 - 70, canvas.height - 30, 140, 30);

            // Draw Paddles
            ctx.fillStyle = paddleTop.color;
            ctx.fillRect(paddleTop.x, paddleTop.y, paddleTop.width, paddleTop.height);

            ctx.fillStyle = paddleBottom.color;
            ctx.fillRect(paddleBottom.x, paddleBottom.y, paddleBottom.width, paddleBottom.height);

            // Draw Ball
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            // Overlays
            if (celebrationTimer > 0 && gameActive) {
                ctx.fillStyle = "#ffcc00";
                ctx.font = "bold 26px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(celebrationText, canvas.width / 2, canvas.height / 2 + 10);
            } else if (!gameActive) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 30px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("FULL TIME", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "#b9ec0c";
                ctx.font = "bold 22px sans-serif";
                ctx.fillText(celebrationText, canvas.width / 2, canvas.height / 2 + 25);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
