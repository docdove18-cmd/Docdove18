<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Rash Football</title>

<style>
*{box-sizing:border-box;touch-action:none}
body{
    margin:0;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}
#game{
    position:relative;
    width:100vw;
    height:100vh;
    background:#16833a;
    overflow:hidden;
}

#field{
    position:absolute;
    width:90vw;
    height:80vh;
    left:5vw;
    top:10vh;
    border:4px solid white;
    background:
      linear-gradient(90deg,
      transparent 49.7%,
      white 49.7%,
      white 50.3%,
      transparent 50.3%);
}

#field:after{
    content:"";
    position:absolute;
    width:20%;
    height:30%;
    border:3px solid white;
    left:40%;
    top:35%;
    border-radius:50%;
}

.player,.enemy,.ball{
    position:absolute;
    transform:translate(-50%,-50%);
    border-radius:50%;
}

.player{
    width:42px;
    height:42px;
    background:#1769ff;
    border:3px solid white;
    z-index:5;
}

.enemy{
    width:40px;
    height:40px;
    background:#e22;
    border:3px solid white;
    z-index:4;
}

.ball{
    width:18px;
    height:18px;
    background:white;
    border:2px solid #111;
    z-index:6;
}

#score{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:25px;
    font-weight:bold;
    z-index:20;
}

#timer{
    position:absolute;
    top:50px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:18px;
    z-index:20;
}

#joystick{
    position:absolute;
    left:25px;
    bottom:25px;
    width:125px;
    height:125px;
    border-radius:50%;
    background:rgba(255,255,255,.2);
    border:2px solid rgba(255,255,255,.6);
}

#stick{
    position:absolute;
    width:55px;
    height:55px;
    left:35px;
    top:35px;
    border-radius:50%;
    background:rgba(255,255,255,.7);
}

.buttons{
    position:absolute;
    right:20px;
    bottom:25px;
    display:flex;
    gap:12px;
}

button{
    width:75px;
    height:75px;
    border-radius:50%;
    border:3px solid white;
    color:white;
    font-weight:bold;
    background:rgba(0,0,0,.45);
}

button:active{
    background:rgba(255,255,255,.4);
}

#message{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:35px;
    font-weight:bold;
    display:none;
    z-index:50;
}
</style>
</head>

<body>

<div id="game">

    <div id="field"></div>

    <div id="score">BLUE 0 - 0 RED</div>
    <div id="timer">90</div>

    <div id="message">GOAL!</div>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div class="buttons">
        <button id="pass">PASS</button>
        <button id="shoot">SHOOT</button>
        <button id="sprint">SPRINT</button>
    </div>

    <div id="player" class="player"></div>
    <div id="enemy" class="enemy"></div>
    <div id="ball" class="ball"></div>

</div>

<script>

const player = document.getElementById("player");
const enemy = document.getElementById("enemy");
const ball = document.getElementById("ball");
const scoreText = document.getElementById("score");
const timerText = document.getElementById("timer");
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");
const message = document.getElementById("message");

let px = 45;
let py = 50;

let ex = 70;
let ey = 50;

let bx = 48;
let by = 50;

let blueScore = 0;
let redScore = 0;

let time = 90;

let joyX = 0;
let joyY = 0;

let sprinting = false;
let ballMoving = false;
let ballVX = 0;
let ballVY = 0;

function render(){

    player.style.left = px + "%";
    player.style.top = py + "%";

    enemy.style.left = ex + "%";
    enemy.style.top = ey + "%";

    ball.style.left = bx + "%";
    ball.style.top = by + "%";

    scoreText.textContent =
        `BLUE ${blueScore} - ${redScore} RED`;

}

function distance(ax,ay,bx,by){
    return Math.sqrt(
        Math.pow(ax-bx,2)+
        Math.pow(ay-by,2)
    );
}

function update(){

    let speed = sprinting ? 0.65 : 0.35;

    px += joyX * speed;
    py += joyY * speed;

    px = Math.max(7,Math.min(93,px));
    py = Math.max(8,Math.min(92,py));

    /*
     * Ball follows player when close.
     */
    if(!ballMoving){

        if(distance(px,py,bx,by) < 7){
            bx = px + joyX * 3;
            by = py + joyY * 3;
        }
    }

    /*
     * Ball physics
     */
    if(ballMoving){

        bx += ballVX;
        by += ballVY;

        ballVX *= 0.97;
        ballVY *= 0.97;

        if(Math.abs(ballVX) < 0.01 &&
           Math.abs(ballVY) < 0.01){

            ballMoving = false;
        }
    }

    /*
     * Enemy AI
     */
    let dx = bx - ex;
    let dy = by - ey;

    let d = Math.sqrt(dx*dx + dy*dy);

    if(d > 0){

        ex += (dx/d) * 0.12;
        ey += (dy/d) * 0.12;
    }

    /*
     * Enemy steals ball
     */
    if(distance(ex,ey,bx,by) < 5){

        ballMoving = false;

        bx = ex;
        by = ey;
    }

    /*
     * Goal detection
     */
    if(bx > 90){

        blueScore++;

        showGoal();

        resetBall();
    }

    if(bx < 10){

        redScore++;

        showGoal();

        resetBall();
    }

    render();

    requestAnimationFrame(update);
}

function showGoal(){

    message.style.display = "block";

    setTimeout(()=>{
        message.style.display = "none";
    },1000);
}

function resetBall(){

    bx = 50;
    by = 50;

    px = 45;
    py = 50;

    ex = 70;
    ey = 50;

    ballMoving = false;

    render();
}

/*
 * JOYSTICK
 */

let dragging = false;

joystick.addEventListener("touchstart",e=>{
    dragging = true;
});

joystick.addEventListener("touchmove",e=>{

    if(!dragging)return;

    const touch = e.touches[0];

    const rect = joystick.getBoundingClientRect();

    let x =
        touch.clientX -
        (rect.left + rect.width/2);

    let y =
        touch.clientY -
        (rect.top + rect.height/2);

    const max = 42;

    let len = Math.sqrt(x*x+y*y);

    if(len > max){

        x = x/len*max;
        y = y/len*max;
    }

    stick.style.left =
        (35+x) + "px";

    stick.style.top =
        (35+y) + "px";

    joyX = x/max;
    joyY = y/max;

});

joystick.addEventListener("touchend",()=>{

    dragging = false;

    joyX = 0;
    joyY = 0;

    stick.style.left = "35px";
    stick.style.top = "35px";
});

/*
 * PASS
 */

document.getElementById("pass")
.addEventListener("touchstart",()=>{

    if(distance(px,py,bx,by) < 10){

        ballMoving = true;

        ballVX = joyX * 1.3;
        ballVY = joyY * 1.3;

        if(Math.abs(joyX)+Math.abs(joyY) < 0.1){

            ballVX = 1;
            ballVY = 0;
        }
    }

});

/*
 * SHOOT
 */

document.getElementById("shoot")
.addEventListener("touchstart",()=>{

    if(distance(px,py,bx,by) < 10){

        ballMoving = true;

        let direction =
            joyX === 0 ? 1 : joyX;

        ballVX = direction * 2.5;

        ballVY = joyY * 2.5;
    }

});

/*
 * SPRINT
 */

const sprintButton =
    document.getElementById("sprint");

sprintButton.addEventListener(
    "touchstart",
    ()=>sprinting=true
);

sprintButton.addEventListener(
    "touchend",
    ()=>sprinting=false
);

/*
 * MATCH TIMER
 */

setInterval(()=>{

    if(time > 0){

        time--;

        timerText.textContent = time;

    }else{

        message.textContent =
            `FULL TIME`;

        message.style.display =
            "block";
    }

},1000);

render();
update();

</script>

</body>
</html>
